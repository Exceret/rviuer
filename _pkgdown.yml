url: https://exceret.github.io/rviuer/

template:
    bootstrap: 5
    light-switch: true
    bslib:
        bootswatch: sandstone
        code_font: { google: "JetBrains Mono" }
        pkgdown-nav-height: 100px

title: rviuer
description: >-
    rviuer draws images, including plots captured straight from R, in the
    terminal. It uses the iTerm, Kitty or Sixel graphics protocols when the
    terminal supports them, and falls back to coloured half-blocks otherwise.

reference:
    - title: Rendering Images
      desc: >
          Draw images in the terminal.
      contents:
          - render_plot
          - print_image

    - title: Capturing Plots
      desc: >
          Turn plotting code into PNG bytes, without temporary files.
      contents:
          - capture_plot

    - title: Pixel Art
      desc: >
          Draw text with the built-in 3 x 5 pixel font.
      contents:
          - draw_pixels
          - pixel_font_3x5
          - get_glyph
          - pixel_font_add

    - title: Pixel Matrices
      desc: >
          Convert text to a matrix of pixels and turn that matrix into ggplot2
          tiles.
      contents:
          - text_to_matrix
          - matrix_to_pixels
          - draw_matrix

    - title: Configuration
      desc: >
          Control transparency, offsets, size and the graphics protocols.
      contents:
          - get_viuer_config

# Navbar configuration
navbar:
    structure:
        left:
            - intro
            - reference
        right:
            - search
            - github
            - lightswitch
    components:
        home:
            text: Home
            icon: fa-home
            href: index.html
        reference:
            text: Functions
            icon: fa-code
            href: reference/index.html
        search: []
        lightswitch:
            icon: fa-sun
            aria-label: Light switch
            id: lightswitch
            menu:
                - text: Light
                  theme: light
                  icon: fa-sun
                - text: Dark
                  theme: dark
                  icon: fa-moon
                - text: Auto
                  theme: auto
                  icon: fa-adjust
        github:
            icon: fab fa-github fa-lg
            href: https://github.com/Exceret/rviuer/
            aria-label: GitHub
