[package]
name = 'rviuer'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.80'

[lib]
crate-type = ['rlib', 'staticlib']
name = 'rviuer'

[[bin]]
name = 'document'
path = 'document.rs'

[features]
default = ['print-file']
# Decode images from disk, as used by `print_from_file()`. Same name as upstream
# viuer's feature, because the vendored copy under `src/viuer/` is gated on it.
print-file = ['image/default-formats']
# Sixel output. Optional upstream as well: it pulls extra crates in.
sixel = ['dep:icy_sixel', 'dep:sixel-rs']
icy_sixel = ['dep:icy_sixel']

[dependencies]
ansi_colours = '1'
base64 = '0.22'
console = { version = '0.16', default-features = false, features = ['std'] }
crossterm = { version = '0.29', default-features = false }
extendr-api = '0.9.0'
# `png` is what `print_image(raw = )` decodes; `print-file` adds the rest.
image = { version = '0.25', default-features = false, features = ['png'] }
icy_sixel = { version = '0.1', optional = true }
owo-colors = '4.0.0'
tempfile = '3'
termcolor = '1'

[target.'cfg(windows)'.dependencies]
crossterm = { version = '0.29', default-features = false, features = ['windows'] }

[target.'cfg(not(windows))'.dependencies]
sixel-rs = { version = '0.5', optional = true }

[profile.release]
lto = true
codegen-units = 1
